# main에 코드를 올리거나 PR을 만들면 Storybook을 Chromatic에 자동 배포
name: Chromatic

on:
  push:
    branches: [main]
  pull_request:

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Chromatic이 이전 빌드와 비교하려면 전체 기록이 필요
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitZeroOnChanges: true # 화면이 바뀌어도 실패 처리하지 않고 Chromatic에서 검토
